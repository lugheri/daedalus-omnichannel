# Stack dos sites dos clientes (ADR 0008; domínio próprio: ADR 0011). Separada da stack principal: publicar
# ou atualizar o servidor de sites não toca na API nem no painel, e vice-versa.
#
# Deploy pelo Docker/sites/deploy-sites.sh (ele calcula SITES_DOMAIN_RE e as
# versões das configs). Os subdomínios (*.SITES_DOMAIN) entram pelo Traefik da
# stack principal, pela rede edge; os domínios próprios, pelo túnel.

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  sites:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    environment:
      SITES_DOMAIN: ${SITES_DOMAIN}
      # URL base do bucket público, já com o bucket: https://s3.provedor.com/omnichannel-sites
      SITES_ORIGIN: ${SITES_ORIGIN}
    configs:
      - source: sites_nginx
        target: /etc/nginx/templates/default.conf.template
    networks: [edge]
    logging: *logging
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 15s
      timeout: 3s
      retries: 3
    deploy:
      replicas: 2
      update_config: { order: start-first, failure_action: rollback }
      labels:
        - traefik.enable=true
        # Qualquer <slug>.SITES_DOMAIN. O $$ é o $ literal (escape do compose).
        - traefik.http.routers.sites.rule=HostRegexp(`^[a-z0-9-]+\.${SITES_DOMAIN_RE}$$`)
        - traefik.http.routers.sites.entrypoints=websecure
        # Certificado curinga (*.SITES_DOMAIN) pelo desafio de DNS da Cloudflare:
        # com HostRegexp o Traefik não sabe os nomes, então o certificado é declarado.
        - traefik.http.routers.sites.tls.certresolver=lesites
        - traefik.http.routers.sites.tls.domains[0].main=${SITES_DOMAIN}
        - traefik.http.routers.sites.tls.domains[0].sans=*.${SITES_DOMAIN}
        - traefik.http.services.sites.loadbalancer.server.port=8080
        - traefik.swarm.lbswarm=true

  # Domínios próprios dos clientes (ADR 0011): túnel de saída para a Cloudflare,
  # que entrega qualquer host apontado para ele ao nginx acima.
  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    command: ['tunnel', '--config', '/etc/cloudflared/config.yml', 'run', '${SITES_TUNNEL_ID}']
    configs:
      - source: sites_tunnel
        target: /etc/cloudflared/config.yml
    secrets: [cf_tunnel_credentials]
    networks: [edge]
    logging: *logging
    # Imagem sem shell (distroless): sem healthcheck por comando. Duas réplicas
    # do mesmo túnel = duas conexões; a Cloudflare reparte entre elas.
    deploy:
      replicas: 2
      update_config: { order: start-first, failure_action: rollback }

configs:
  # Configs do Swarm são imutáveis: o nome leva o hash do arquivo, e mudar o
  # template cria uma config nova (o deploy-sites.sh calcula o hash).
  sites_nginx:
    name: sites_nginx_${SITES_CONFIG_VERSION}
    file: ./nginx.conf.template
  sites_tunnel:
    name: sites_tunnel_${SITES_TUNNEL_CONFIG_VERSION}
    file: ./cloudflared.yml

secrets:
  # JSON do "cloudflared tunnel create" (docs/deploy.md).
  cf_tunnel_credentials: { external: true }

networks:
  edge:
    external: true
    name: omnichannel_edge
