name: omnichannel-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: omnichannel
      POSTGRES_PASSWORD: omnichannel
      POSTGRES_DB: omnichannel
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omnichannel']
      interval: 5s
      timeout: 3s
      retries: 10

  # Rate limit, cache de permissões, filas (BullMQ) e tempo real (Socket.IO).
  # Em dev sem persistência: os dados do Redis são descartáveis.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
