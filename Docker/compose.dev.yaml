# Senhas vêm do Docker/.env (fora do git; modelo em .env.example).
name: omnichannel-dev

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: omnichannel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no Docker/.env}
      POSTGRES_DB: omnichannel
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omnichannel']
      interval: 5s
      timeout: 3s
      retries: 10

  # Rate limit, cache de permissões, filas (BullMQ) e tempo real (Socket.IO).
  # Em dev sem persistência: os dados do Redis são descartáveis.
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Arquivos (mídia das conversas). Em produção é o S3: mesma API, só muda o env.
  # A MinIO deixou de publicar imagens públicas (Docker Hub e Quay); esta é a
  # cópia congelada da Bitnami — ok para dev. Como o código usa só a API S3,
  # trocar por outro compatível (SeaweedFS, RustFS) é só mexer aqui.
  # Console web: http://127.0.0.1:9001 (usuário omnichannel; senha no Docker/.env)
  minio:
    image: bitnamilegacy/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: omnichannel
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no Docker/.env}
      # Buckets criados na inicialização: `omnichannel` (privado) e `sites`
      # (leitura pública, como o bucket de sites da produção — ADR 0008).
      MINIO_DEFAULT_BUCKETS: omnichannel,sites:download
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'curl', '-fs', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10

  # Servidor dos sites dos clientes, com o mesmo template da produção
  # (Docker/sites). Em dev o "domínio" é localhost: http://<slug>.localhost:8088
  # (o navegador resolve qualquer *.localhost para a própria máquina).
  sites:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    environment:
      SITES_DOMAIN: localhost
      SITES_ORIGIN: http://minio:9000/sites
    volumes:
      - ./sites/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - '8088:8080'
    depends_on:
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
