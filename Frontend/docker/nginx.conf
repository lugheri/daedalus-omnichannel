# SPA estática. O Traefik termina o TLS na frente; aqui é HTTP interno.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Cabeçalhos de segurança do painel (a API tem os dela).
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Arquivos com hash no nome (JS/CSS do Vite): cache de 1 ano.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Config de runtime e index: nunca em cache (mudam a cada deploy).
  location = /config.js {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /health {
    access_log off;
    return 200 'ok';
  }

  # Rotas do React Router caem no index.html.
  location / {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    try_files $uri /index.html;
  }
}
